# SnapshotScreener 설정 파일 예시
# 사용법: snapshot-screener --config config/example.yaml
# CLI 인자를 추가하면 config 값을 오버라이드합니다:
#   snapshot-screener --config config/example.yaml --verbose --eqpid EQ-9999

# ---- 분석 대상 ----
eqpid: EQ-2471                    # 단일 장비
# eqpids:                         # 복수 장비 (eqpid 대신 사용)
#   - EQ-2471
#   - EQ-2472
#   - EQ-2473
# eqpid_list: eqpids.txt          # 또는 파일 경로

date_from: "2026-03-11"
date_to: "2026-03-25"

# ---- Cassandra 접속 ----
db_host: 10.0.1.50
db_port: 9042
db_keyspace: factory
db_table: snapshots
db_username: null                  # 인증 불필요 시 null
db_password: null                  # 또는 SS_DB_PASSWORD 환경변수 사용 권장

# ---- Cassandra 보호 ----
# 주의: 모든 쿼리는 SELECT 전용이며 파티션 키를 전체 지정합니다 (풀스캔 불가).
# 아래 값은 PRD 기준 기본값으로, 프로덕션 Cassandra에 안전합니다.
# 값을 낮추면 실행이 빨라지지만 Cassandra 부하가 증가합니다.
read_delay_ms: 200                 # 이미지 쿼리 간격 (ms, PRD 기본값)
fname_delay_ms: 100                # fname 쿼리 간격 (ms, PRD 기본값)
max_connections: 2                 # 커넥션 풀 최대 크기 (PRD 기본값)
#
# 최초 실행 예상 부하 (14일 × 3,000장/일 기준):
#   Phase 1 (fname 조회): 14 쿼리, ~2초
#   Phase 2 (pHash 계산): 42,000 이미지 × 200ms = ~2시간 20분
#   Phase 4 (리포트 이미지): ~100장 × 200ms = ~20초
# → 최초 실행은 야간/새벽 시간대 권장
# → 2회차 이후: pHash 캐시 히트로 수 분 내 완료

# ---- 분석 파라미터 ----
session_gap_ms: 900000             # 세션 분리 gap (15분, 900,000ms)
phash_similar_threshold: 4         # 같은 화면 판정 pHash 거리 임계값
phash_transition_threshold: 8      # 화면 전환 판정 pHash 거리 임계값
delta_spike_ms: 30000              # 시간 간격 스파이크 임계값 (30초)
dbscan_eps: 0.04                   # DBSCAN epsilon (정규화 좌표 기준, 0.04 = 화면의 4%)
dbscan_min_samples: 2              # DBSCAN 최소 샘플 수
cv_high_threshold: 0.3             # 세션 CV가 이 값 미만이면 "높음" 판정
cv_low_threshold: 0.85             # 세션 CV가 이 값 초과이면 "낮음" 판정
screen_width: 1920                 # 화면 해상도 (좌표 정규화용)
screen_height: 1080
selector: simple                   # simple (파일럿) | scored (Phase 2용)
sensitivity_sweep: false           # true: 레이어 C 파라미터 민감도 분석 실행
fname_pattern: auto                # auto | 커스텀 정규식

# ---- 출력 ----
cache_dir: "."                     # pHash 캐시 SQLite 저장 위치
output_dir: "./output"             # HTML 리포트 + JSON + 원본 프레임 출력 위치
invalidate_cache: false            # true: 기존 캐시 삭제 후 재계산
verbose: false

# ---- 출력 언어 ----
lang: ko                           # ko (한국어) | en (English)


# ========================================================================
# 트리아지 모드 설정 예시
# ========================================================================
# 트리아지 모드: 이미지를 읽지 않고 snapshotlist 테이블의 fname 메타데이터만으로
# 1만 대 이상의 장비를 경량 스크리닝한다. (10,000대 기준 20~45분 소요)
#
# 사용법 1: config 파일만으로 실행 (triage: true 설정)
#   snapshot-screener --config config/triage_example.yaml
#
# 사용법 2: CLI 플래그로 실행
#   snapshot-screener --triage --csv equipment.csv --config config/example.yaml
#
# 아래 설정을 별도 파일(예: triage_example.yaml)로 저장하거나,
# 위 일반 모드 설정과 함께 두고 triage: true를 추가하면 된다.
# 트리아지 모드에서 일반 모드 전용 설정(eqpid, phash_*, selector 등)은 무시된다.
# ========================================================================

# 위의 db_host, db_keyspace, date_from, date_to 등은 그대로 공유된다.
# 아래 트리아지 전용 설정만 추가하면 된다.
#
# triage: true                        # 트리아지 모드 활성화 (--triage 플래그 대체)
# csv: equipment.csv                  # 장비 CSV (열 순서: process, model, eqpid)
#                                     # 절대 경로 또는 상대 경로 (config 파일 기준)
# db_snapshotlist_table: snapshotlist # snapshotlist 테이블명 (기본: snapshotlist)
# fname_delay_ms: 50                  # fname 쿼리 간격 (기본: 50ms, 일반 모드보다 빠름)
# output_dir: ./triage_output         # 리포트 출력 (CSV + JSON + HTML)
# circuit_breaker_threshold: 10       # 연속 N회 실패 시 헬스체크 → 중단 (기본: 10)
# health_check_interval: 500          # N장비마다 커넥션 헬스체크 (기본: 500)
# max_clicks_per_equipment: 50000     # 장비당 클릭 상한, 초과 시 DBSCAN 스킵 (기본: 50000)
